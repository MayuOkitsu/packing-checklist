name: Notify mail_preview_viewer on Mail Template Change

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "README.md"

permissions:
  pull-requests: read
  issues: write

jobs:
  check-mail-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Check Mail Template Changes and Comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- id: mail-preview-viewer-alert -->';
            const { owner, repo, number: issue_number } = context.issue;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: issue_number,
              per_page: 100
            });

            const targetPattern =
              /^(src\/App\/FrontBundle\/Resources\/config\/mail\/mail\.yml|src\/App\/FrontBundle\/Resources\/views\/.*\/mail\/.*\.html\.twig)$/;

            const matchedFiles = files.filter(file =>
              targetPattern.test(file.filename) ||
              (file.previous_filename && targetPattern.test(file.previous_filename))
            );

            // 対象ファイルがなくなった場合は通知コメントを更新しない
            if (matchedFiles.length === 0) {
              console.log('対象ファイルの変更はありません。');
              return;
            }

            const statusMap = {
              added: 'A (新規)',
              modified: 'M (変更)',
              renamed: 'R (改名)',
              removed: 'D (削除)'
            };

            const fileRows = matchedFiles.map(file => {
              const status = statusMap[file.status] || file.status;
              const path = file.status === 'renamed'
                ? `${file.previous_filename} → ${file.filename}`
                : file.filename;

              return `- **[${status}]** \`${path}\``;
            }).join('\n');

            const body = `${marker}

            ### ⚠️ \`mail_preview_viewer\` 更新確認のお願い (homes-pc)

            \`oem-inquiry-sendmail\` のメール定義またはテンプレートに変更が検知されました。
            homes-pc 内の \`mail_preview_viewer\` に同梱されている 静的プレビューの更新要否をご確認ください。

            #### 対象ファイル差分
            ${fileRows}

            #### 次のステップ
            - 必要に応じて、homes-pc 側で \`render.php\` による静的スナップショットの再生成・更新 PR の作成を行ってください。
            - 本PRのマージは妨げられません。`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const botLogin = 'github-actions[bot]';
            const existingComment = comments.find(comment =>
              comment.user?.login === botLogin &&
              comment.body?.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
              console.log('既存の通知コメントを更新しました。');
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
              console.log('通知コメントを投稿しました。');
            }
